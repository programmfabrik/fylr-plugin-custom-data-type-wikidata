plugin:
  name: custom-data-type-wikidata
  version: 1
  url: https://github.com/programmfabrik/fylr-custom-data-type-wikidata
  displayname:
    de-DE: Wikidata-Verknüpfung
    en-US: Wikidata-Referencing
  info:
    de-DE: |
      Ergänzt einen benutzerdefinierten Datentyp, mit dem sich fylr-Datensätze mit Einträgen aus Wikidata, der freien Wissensdatenbank, verknüpfen lassen. Bei der Eingabe schlägt das Feld passende Wikidata-Einträge vor und speichert Bezeichnung und URI als verlässliche Normdatenreferenz.

      - Vorschlagssuche über Wikidata-Einträge
      - Suche wahlweise auf Institutionen, Personen, Orte oder eine eigene Klasse eingrenzen
      - Speichert bevorzugte Bezeichnung, Concept-URI und einen Volltext aus Labels und Notationen
      - Mehrsprachige Facettenbegriffe für die facettierte Suche
      - Standard- oder kompakte einzeilige Editordarstellung

      Bindet [Wikidata](https://www.wikidata.org) an.
    en-US: |
      Adds a custom data type for linking fylr records to entities in Wikidata, the free collaborative knowledge base. As you type, the field suggests matching Wikidata records and stores their label and URI, giving you reliable authority references.

      - Type-ahead search over Wikidata records
      - Scope the search to institutions, persons, places or a custom class
      - Stores preferred label, concept URI and a fulltext string of labels and notations
      - Multilingual facet terms for faceted search
      - Default or condensed single-line editor display

      Integrates with [Wikidata](https://www.wikidata.org).
  server:
    api-version:
      require: 1
  l10n: l10n/customDataTypeWikidata.csv
  webfrontend:
    url: customDataTypeWikidata.js
    css: customDataTypeWikidata.css
    dependencies:
      - commons-library


base_url_prefix: "webfrontend"
custom_types:
  wikidata:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      schema:
        - name: institution
          parameters:
            value:
              type: bool
        - name: person
          parameters:
            value:
              type: bool
        - name: place
          parameters:
            value:
              type: bool
        - name: custom
          parameters:
            value:
              type: text
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]
    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/wikidataUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 120
      batch_size: 10
      expires_days: 1

base_config:
  - name: update_wikidata
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      default_language:
        type: text
        default: 'de'
        position: 3
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 4
