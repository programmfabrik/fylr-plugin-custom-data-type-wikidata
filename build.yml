# Build configuration for fylr-build-plugin — the explicit build description.
# Delivered files are listed here; "check" (runs with every build) warns when
# a manifest reference is missing from the build folder.
# All features: https://github.com/programmfabrik/fylr-build-plugin
#
# customDataTypeWikidata.zip is the name this plugin has always published. fylr updates a
# url plugin by re-fetching the url it stored at install time, so that name is
# kept as an alias beside the repository-named asset — without it every
# existing installation would stop updating, silently.

server:
  install:
  - l10n/customDataTypeWikidata.csv
webfrontend:
  coffee1:
  - webfrontend/CustomDataTypeWikidata.coffee
  - webfrontend/CustomDataTypeWikidataFacet.coffee
  - webfrontend/wikidataUtilities.coffee
  install:
  - webfrontend/customDataTypeWikidata.css
build:
  bundles:
  - out: updater/wikidataUpdater.js
    sources:
    - src/updater/wikidataUpdater.js
    - webfrontend/wikidataUtilities.coffee
  zip_aliases:
  - customDataTypeWikidata.zip
